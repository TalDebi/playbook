- name: Ansible Playbook for File and Package Management
  hosts: dana_vms
  become: yes
  vars_files:
    - group_vars/dana_vms.yml
  tasks:
    - name: Check if the file already exists
      stat:
        path: "{{ file_path }}"
      register: file_stat

    - name: Create a text file with your name (if not exists)
      copy:
        content: "{{ user_name }}\n"
        dest: "{{ file_path }}"
        mode: '0644'
      when: not file_stat.stat.exists
      changed_when: not file_stat.stat.exists
      tags: create_file

    - name: Store the contents of the file
      command: cat "{{ file_path }}"
      register: file_content
      failed_when: file_content.rc != 0
      changed_when: false
      tags: read_file

    - name: Print file contents to stdout
      debug:
        msg: "{{ file_content.stdout }}"
      tags: print_file

    - name: Install python-devel package
      package:
        name: "{{ package_name }}"
        state: present
      tags: install_package

    - name: Delete the text file
      file:
        path: "{{ file_path }}"
        state: absent
      tags: delete_file
